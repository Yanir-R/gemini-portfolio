<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Yanir Rot - Full-Stack AI Engineer</title>
        <meta name="title" content="Yanir Rot - Full-Stack AI Engineer" />
        <meta
            name="description"
            content="Yanir Rot - full-stack engineer working on production LLM and multi-agent systems. Ask the assistant here about the work: it answers from what he has written down, and says so when that is not enough."
        />

        <!-- The site-URL placeholder below is substituted at build time from the
             VITE_SITE_URL env var, which a production build requires. Set that
             variable to the real domain rather than hardcoding a host here. -->
        <link rel="canonical" href="%VITE_SITE_URL%/" />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
        <meta property="og:title" content="Yanir Rot - Full-Stack AI Engineer" />
        <meta
            property="og:description"
            content="Yanir Rot - full-stack engineer working on production LLM and multi-agent systems. Ask the assistant here about the work: it answers from what he has written down, and says so when that is not enough."
        />
        <!-- og:image / twitter:image are intentionally absent: there is no
             preview asset yet, and advertising a URL that 404s renders an empty
             card on most platforms. twitter:card is "summary" for the same
             reason - "summary_large_image" reserves a large image area that
             would stay blank.

             To enable: add frontend/public/preview-image.jpg (1200x630), then
             re-add og:image and twitter:image pointing at the site-URL
             placeholder plus /preview-image.jpg, and switch the card type back
             to summary_large_image. -->

        <meta property="twitter:card" content="summary" />
        <meta property="twitter:url" content="%VITE_SITE_URL%/" />
        <meta property="twitter:title" content="Yanir Rot - Full-Stack AI Engineer" />
        <meta
            property="twitter:description"
            content="Yanir Rot - full-stack engineer working on production LLM and multi-agent systems. Ask the assistant here about the work: it answers from what he has written down, and says so when that is not enough."
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
