name: Frontend Deploy v2

on:
  push:
    branches: [main, prod]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

env:
  FRONTEND_DIR: frontend

jobs:
  # Runs on pull requests and pushes. This is the job that gates a PR — it must
  # not need cloud credentials, and it must not deploy anything.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run typecheck

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Check formatting
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run format:check

      - name: Check link-preview copy
        working-directory: ${{ env.FRONTEND_DIR }}
        # index.html and tools/og-image.html cannot import the page's constants,
        # so the standfirst is duplicated into them by hand. A stale preview
        # passes every other check here - the page renders correctly and the
        # only symptom shows up in someone else's Slack.
        run: npm run check:preview-copy

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        # Compile check only — this artifact is never deployed.
        #
        # It used to set VITE_ALLOW_UNCONFIGURED_BUILD because the URLs arrived
        # from repository secrets that this job deliberately does not have, so
        # vite.config's guard would have failed it. They come from
        # site.config.ts now, which is checked out with the code, so the guard
        # is satisfied here for the same reason it is satisfied in the deploy —
        # and leaving the flag would have kept announcing "this build is
        # deliberately unconfigured" about a build that is fully configured.
        run: npm run build

      - name: Audit dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

  # Cloudflare Pages deploy. The frontend is a static bundle, so it belongs on a
  # CDN rather than in a container.
  #
  # Gated on the repository variable CLOUDFLARE_PAGES_ENABLED so the job can be
  # switched off without editing the workflow.
  deploy-pages:
    if: github.event_name == 'push' && vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      # Deliberately rebuilds rather than reusing verify's dist/. The site and
      # backend URLs are inlined into the bundle at build time, and verify
      # builds with VITE_ALLOW_UNCONFIGURED_BUILD, so its output carries the
      # development fallbacks. Sharing that artifact would deploy a frontend
      # pointing at localhost.
      #
      # No VITE_* variables are injected here any more, on purpose. They used to
      # come from repository secrets and variables, and because Vite inlines
      # them at build time a value changed *after* a deploy silently did
      # nothing - which is exactly what happened once: the frontend deployed at
      # 09:15, the backend URL changed at 09:19, and the bundle went on pointing
      # at the previous host while the site kept working.
      #
      # They live in frontend/site.config.ts now. None of them was ever a
      # secret - the site URL is in every OpenGraph tag, the backend URL is in
      # the bundle and the CSP - so committing them costs no confidentiality and
      # removes the ordering trap entirely: changing one is a commit, and a
      # commit is a deploy. Adding an override back here would reinstate the
      # trap, because the environment wins over the file.
      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.FRONTEND_DIR }}
          # --branch drives Pages' production vs preview split; set the Pages
          # project's production branch to `prod` to mirror the Cloud Run flow.
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
