name: Frontend Deploy v2

on:
  push:
    branches: [main, prod]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

env:
  FRONTEND_DIR: frontend

jobs:
  # Runs on pull requests and pushes. This is the job that gates a PR — it must
  # not need cloud credentials, and it must not deploy anything.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run typecheck

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Check formatting
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run format:check

      - name: Check link-preview copy
        working-directory: ${{ env.FRONTEND_DIR }}
        # index.html and tools/og-image.html cannot import the page's constants,
        # so the standfirst is duplicated into them by hand. A stale preview
        # passes every other check here - the page renders correctly and the
        # only symptom shows up in someone else's Slack.
        run: npm run check:preview-copy

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        # Compile check only — this output is never deployed.
        #
        # No VITE_ALLOW_UNCONFIGURED_BUILD: the site and backend URLs come from
        # frontend/site.config.ts, which is checked out with the code, so
        # vite.config's production guard is satisfied here without credentials.
        run: npm run build

      - name: Audit dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

  # Cloudflare Pages deploy. The frontend is a static bundle, so it belongs on a
  # CDN rather than in a container.
  #
  # Gated on the repository variable CLOUDFLARE_PAGES_ENABLED so the job can be
  # switched off without editing the workflow.
  deploy-pages:
    if: github.event_name == 'push' && vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      # Builds again rather than reusing verify's output: jobs get separate
      # runners and nothing is uploaded between them. The result is the same
      # bundle, because every build value is committed rather than injected.
      #
      # No VITE_* variables are set here, on purpose. Build values come from
      # frontend/site.config.ts, and Vite inlines them, so config that lives in
      # the repository ships with the commit that changed it. An override here
      # would take precedence over the file and reintroduce the split where a
      # value changed after a deploy has no effect until the next build.
      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.FRONTEND_DIR }}
          # --branch drives Pages' production vs preview split; set the Pages
          # project's production branch to `prod` to mirror the Cloud Run flow.
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
