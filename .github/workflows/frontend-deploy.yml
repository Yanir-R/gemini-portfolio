name: Frontend Deploy v2

on:
  push:
    branches: [main, prod]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

env:
  FRONTEND_DIR: frontend

jobs:
  # Runs on pull requests and pushes. This is the job that gates a PR — it must
  # not need cloud credentials, and it must not deploy anything.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run typecheck

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Check formatting
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run format:check

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        # Compile check only — this artifact is never deployed, so it runs
        # without the deploy-time URLs. The flag keeps vite.config's guard from
        # rejecting a deliberately unconfigured build.
        env:
          VITE_ALLOW_UNCONFIGURED_BUILD: 'true'
        run: npm run build

      - name: Audit dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

  # Cloudflare Pages deploy. The frontend is a static bundle, so it belongs on a
  # CDN rather than in a container.
  #
  # Gated on the repository variable CLOUDFLARE_PAGES_ENABLED so the job can be
  # switched off without editing the workflow.
  deploy-pages:
    if: github.event_name == 'push' && vars.CLOUDFLARE_PAGES_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      # Deliberately rebuilds rather than reusing verify's dist/. VITE_BACKEND_URL
      # is inlined into the bundle at build time, and verify builds without
      # secrets, so its output hardcodes the vite.config fallback URL. Sharing
      # that artifact would deploy a frontend pointing at the wrong backend.
      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          # Required: a production build fails if this or VITE_BACKEND_URL is
          # empty, so an unset SITE_URL variable breaks the deploy rather than
          # silently shipping a wrong canonical URL.
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          # Optional, and a variable rather than a secret: it is a public image
          # URL, not a credential. The photograph is deliberately not committed
          # - this repository is public and its history permanent - so
          # production has to be told where it lives. Unset is a supported
          # state: the avatar falls back to an initial-letter mark rather than
          # breaking the build, which is why this is not in the required check
          # above.
          VITE_AVATAR_URL: ${{ vars.AVATAR_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.FRONTEND_DIR }}
          # --branch drives Pages' production vs preview split; set the Pages
          # project's production branch to `prod` to mirror the Cloud Run flow.
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
