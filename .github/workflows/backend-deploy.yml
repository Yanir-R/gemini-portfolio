name: Backend Deploy v2

on:
  push:
    branches: [main, prod]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  BACKEND_DIR: backend

jobs:
  # Runs on pull requests and pushes. This is the job that gates a PR — it must
  # not need cloud credentials, and it must not deploy anything.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements*.txt

      - name: Install Dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        # requirements-dev.txt includes requirements.txt, so this installs the
        # runtime dependencies plus pytest.
        run: pip install -r requirements-dev.txt

      - name: Compile sources
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -m compileall -q . -x '(venv|\.venv)'

      - name: Import smoke check
        working-directory: ${{ env.BACKEND_DIR }}
        # No secrets needed: missing email/API config only logs a warning at
        # import, so this still catches syntax, import and routing breakage.
        run: python -c "import main; assert main.app.routes, 'no routes registered'"

      - name: Tests
        working-directory: ${{ env.BACKEND_DIR }}
        # Context-layer regressions only, and none of them reach the network:
        # what the model is given, what must never reach it, and what it must
        # never be asked to answer without. The prompt itself is evaluated by
        # evals/run_eval.py, which is run by hand because it costs Gemini quota
        # and its most useful checks are the ones a person reads.
        run: pytest -q

      - name: Audit dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # Deploys only on push to main/prod. Both branches target the same fixed Cloud
  # Run service names, so running this for a pull request would overwrite the
  # shared environment with unreviewed code.
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up environment variables
        id: env
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/prod' ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
          fi
          echo "GCP_PROJECT=${{ secrets.GCP_DEV_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements.txt

      - name: Install Dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install -r requirements.txt

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare deployment files
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          # Write the Dockerfile the deploy builds from. It overwrites the
          # committed backend/Dockerfile, which stays as the local-build
          # reference; the two must describe the same container, so a change to
          # the run command belongs in both.
          cat > Dockerfile << 'EOL'
          FROM python:3.12-slim

          WORKDIR /app

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY . .

          ENV PORT=8080

          CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
          EOL

          # Create .gcloudignore. This is a denylist, not an allowlist: every
          # path not listed here is uploaded to Cloud Build, which is what keeps
          # docs/ and every module in the image without naming them.
          #
          # Kept in step with the committed backend/.gcloudignore, which governs
          # a manual `gcloud run deploy --source .` from a developer machine.
          cat > .gcloudignore << 'EOL'
          .git
          .gitignore
          __pycache__
          *.pyc
          .env*
          .vscode
          .github
          venv/
          README.md
          tests/
          evals/
          pytest.ini
          requirements-dev.txt
          EOL

          # Verify files
          echo "Checking for required files:"
          ls -la Dockerfile

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          echo "Starting deployment process..."
          cd ${{ env.BACKEND_DIR }}

          # --set-env-vars uses gcloud's ^DELIM^ syntax (see `gcloud topic
          # escaping`): ALLOWED_ORIGINS is itself a comma-separated list, and a
          # comma-delimited flag would split it into bare items with no "=",
          # failing the deploy or truncating the CORS allowlist. "|" cannot
          # appear in a URL or email address.
          #
          # Both flags stay on one line each. A "\" continuation inside the
          # quoted value keeps the next line's indentation, which would give
          # every item after the first ~26 leading spaces in its key.
          #
          # --service-account is the identity the container RUNS as, and it is
          # deliberately not the identity that deploys it. github-deployer holds
          # run.admin, artifactregistry.writer, secretmanager.secretAccessor and
          # iam.serviceAccountUser because deploying needs them. Running the
          # container as that account would hand all four to anyone who achieved
          # code execution inside it - the metadata server will mint a token for
          # whatever the service runs as, so an SSRF or RCE in the chat path
          # would have been enough to redeploy the service, push images, and
          # read every secret in the project. GCP_RUNTIME_SA can read the
          # secrets on the --set-secrets line and nothing else.
          #
          # It is a variable rather than a secret because a service account
          # email is an identifier, not a credential; the deploy is authorised
          # by Workload Identity Federation, which is scoped to this repository.
          gcloud run deploy backend \
            --source . \
            --platform managed \
            --region me-west1 \
            --project ${{ env.GCP_PROJECT }} \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=4 \
            --memory=512Mi \
            --timeout=300 \
            --service-account=${{ vars.GCP_RUNTIME_SA }} \
            --set-env-vars="^|^ENVIRONMENT=${{ env.ENVIRONMENT }}|EMAIL_ADDRESS=${{ secrets.EMAIL_ADDRESS }}|YOUR_EMAIL=${{ secrets.YOUR_EMAIL }}|ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest,EMAIL_PASSWORD=email-password:latest,ORIGIN_SHARED_SECRET=edge-shared-secret:latest" \
            --labels="managed-by=github-actions,commit-sha=${{ github.sha }}" \
            --quiet

      # There is no custom-domain step. Cloud Run domain mappings are not
      # offered in me-west1, so `gcloud beta run domain-mappings` cannot map one
      # here. The public API hostname is served by the Cloudflare Worker in
      # edge/, which reaches this service over its run.app URL.
